name: Update Project Select

on:
  schedule:
    # off the top of the hour — scheduled runs at :00 are the ones GitHub delays most
    - cron: "17 */3 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

# One run at a time: every run appends to the same history file.
concurrency:
  group: fleet-status
  cancel-in-progress: false

jobs:
  update-fleet:
    runs-on: ubuntu-latest
    # Never-fail contract: every step below is written to degrade quietly instead of
    # failing the job, but this is kept as a last-resort safety net too.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check every deployment and redraw project-select.svg
        env:
          GH_TOKEN: ${{ secrets.GH_CONTRIB_PAT }}
          GH_LOGIN: kartikeyajay2006
        run: python3 scripts/generate_select.py || echo "::warning::generator reported a problem; existing files are kept as-is."

      - name: Commit and push if changed
        run: |
          set +e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- assets/project-select.svg data/fleet-history.json data/project-stats.json && \
             [ -z "$(git ls-files --others --exclude-standard -- assets/project-select.svg data/)" ]; then
            echo "No change — skipping commit."
            exit 0
          fi

          git add assets/project-select.svg data/fleet-history.json data/project-stats.json
          git commit -m "chore: sync project select [skip ci]"

          # Several workflows push to main at the same moment on every push event;
          # without a rebase-and-retry the loser's data silently goes stale.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "::warning::push attempt $attempt failed, retrying after pulling latest main."
            git pull --rebase origin main
            sleep $((attempt * 3))
          done

          echo "::warning::could not push after 5 attempts; leaving the commit local to this run. Next scheduled run will retry."
          exit 0
