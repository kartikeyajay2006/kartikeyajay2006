  <text x="580" y="97" text-anchor="middle" font-family="Consolas, 'SF Mono', monospace" font-size="10.5" letter-spacing="1" fill="#8a8a8a">AI/ML ENGINEER · FOUNDER · SYSTEM BUILDER</text>

