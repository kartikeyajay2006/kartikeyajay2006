  <text x="920" y="205" font-family="Consolas, 'SF Mono', monospace" font-size="12" fill="#808080">Cardano-BlockPhantom</text>

  <!-- legend -->
  <line x1="20" y1="358" x2="1130" y2="358" stroke="#1f1f1f" stroke-width="1"/>
  <circle cx="30" cy="374" r="2.3" fill="#f5a623"/>
