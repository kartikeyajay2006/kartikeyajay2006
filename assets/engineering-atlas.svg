<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 460" width="100%" role="img" aria-labelledby="atlasTitle atlasDesc">
  <title id="atlasTitle">Engineering Atlas</title>
  <desc id="atlasDesc">Kartikeya Yadav at the center, connected to four engineering domains: Agentic Systems (multi-layer_orchestation, agent--flow), Intelligent Systems (Kovidam-Skill-Graph, kovidam-AI-Interview, RL-model-Negotiation, AI-Video-Editor, Financial-Health-Score, ai-image-classifier), Products (GitVeda, blood-group-donor), and Web3 (Cardano-BlockPhantom, marked experimental).</desc>

  <defs>
    <pattern id="dotgrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#161616"/>
    </pattern>
  </defs>

  <rect x="0.5" y="0.5" width="1149" height="459" rx="14" fill="#0a0a0a" stroke="#1f1f1f"/>
  <rect x="14" y="14" width="1122" height="432" fill="url(#dotgrid)"/>

  <text x="20" y="26" font-family="Consolas, 'SF Mono', monospace" font-size="10" fill="#555">ATLAS // 01</text>
  <text x="1130" y="26" text-anchor="end" font-family="Consolas, 'SF Mono', monospace" font-size="10" fill="#555">LAYER · DOMAIN · SYSTEM</text>

  <!-- center node -->
  <rect x="480" y="34" width="200" height="46" rx="6" fill="#141414" stroke="#f5a623" stroke-width="1.2"/>
  <text x="580" y="63" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="2" fill="#f5a623">KARTIKEYA</text>
  <text x="580" y="101" text-anchor="middle" font-family="Consolas, 'SF Mono', monospace" font-size="10.5" letter-spacing="1" fill="#8a8a8a">AI/ML ENGINEER · FOUNDER · SYSTEM BUILDER</text>

