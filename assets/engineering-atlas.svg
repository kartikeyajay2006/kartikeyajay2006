  <circle cx="290" cy="374" r="2.3" fill="#6b6b6b"/>
  <text x="300" y="378" font-family="Consolas, 'SF Mono', monospace" font-size="10" fill="#8a8a8a">experimental / early-stage</text>

  <text x="580" y="416" text-anchor="middle" font-family="Consolas, 'SF Mono', monospace" font-size="10" fill="#666">Every node is a real, public, verified repository — no invented systems.</text>
