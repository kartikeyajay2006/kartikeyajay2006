<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 428" width="100%" role="img" aria-labelledby="idTitle idDesc">
<title id="idTitle">Identity — how I build</title>
<desc id="idDesc">Kartikeya Yadav. I build AI agents that act — and prove it. AI/ML engineer and co-founder of Kovidam, an AI talent-intelligence platform. I build systems end to end: the model, the agents that use it, the backend underneath and the product on top. Architected, not prompted — real data pipelines, real evaluation, and a person in charge of anything that can’t be undone. Beside it, the four laws drawn as a pipeline every agent action passes through, each gate lighting as the action reaches it: Prove it worked: ForgeSRE checks recovery against thresholds; EraseOps rescans until nothing personal is left.; A human signs off: ForgeSRE stops before a production rollback; EraseOps waits for approval of one exact plan hash.; Show the source: The evidence console links every answer to the exact video second or PDF page it came from.; Run where the data lives: AEGIS runs on one machine with no outbound calls; JKY Terminal and my-localmcp are local-first.. Live: 39 public repositories, 19.1 MB of code, building since June 2025.</desc>
