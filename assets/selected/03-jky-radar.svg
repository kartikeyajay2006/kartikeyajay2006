<title id="t2">Selected work 03: JKY-Radar</title>
<desc id="d2">JKY-Radar, Developer Tool · Api Contracts. Know what breaks before you ship: API contract diffs with a release gate. Proof from its repository: 157 rules · 558 tests. How it works: Two versions to Parse safely; Parse safely to Match; Match to Classify; Classify to Gate; Gate to Impact. Built with Node.js, Express, MongoDB, React. 1.1 MB of code, 29 commits. Live demo online in 471 ms.</desc>
