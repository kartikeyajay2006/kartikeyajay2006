<title id="t2">Sheet 03 — AI Video Studio</title>
<desc id="d2">AI Video Studio, Ai Product · Media. Upload a raw clip, get it back with styled captions timed to the speech. How it works: Upload MP4 to Whisper; Whisper to Edit plan; Edit plan to ASS captions; ASS captions to FFmpeg; Chat restyle to Edit plan. Built with Next.js, FastAPI, Whisper, FFmpeg. 174 KB of code, 14 commits.</desc>
