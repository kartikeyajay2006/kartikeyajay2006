<title id="t3">Selected work 04: ForgeSRE</title>
<desc id="d3">ForgeSRE, Agentic · Sre. An SRE agent that proves its fix, and stops for a human before a rollback. Proof from its repository: 17 mcp tools · 79 tests. How it works: Alerts to Investigate; Investigate to Prove; Prove to Restart; Prove to Human gate; Restart to Verify; Human gate to Verify. Built with Python, MCP, Docker, PostgreSQL. 326 KB of code, 20 commits.</desc>
