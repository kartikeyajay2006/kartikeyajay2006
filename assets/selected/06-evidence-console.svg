<title id="t5">Selected work 06: Evidence Console</title>
<desc id="d5">Evidence Console, Intelligence · Multimodal Rag. Every answer links to the exact video second or PDF page it came from. Proof from its repository: 125+ tests. How it works: Video · PDF to Extract; Extract to Cross-link; Cross-link to pgvector; Cross-link to Neo4j; pgvector to Cited answer; Neo4j to Cited answer. Built with FastAPI, React, pgvector, Neo4j. 759 KB of code, 70 commits. Live demo online in 262 ms.</desc>
