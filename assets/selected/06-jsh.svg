<title id="t5">Sheet 06 — jsh</title>
<desc id="d5">jsh, Systems · Java. A POSIX-style Unix shell, written from scratch in about 600 lines of Java. How it works: Input line to Tokenizer; Tokenizer to Redirect · pipe; Redirect · pipe to Builtin; Redirect · pipe to PATH lookup; PATH lookup to Jobs table. Built with Java, JLine, Maven. 24 KB of code, 50 commits.</desc>
