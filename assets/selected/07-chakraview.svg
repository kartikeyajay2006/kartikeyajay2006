<title id="t6">Selected work 07: Chakraview</title>
<desc id="d6">Chakraview, Agent Ops · Command Center. Launch many agents at once, watch every step, hold unsure results for a human. Proof from its repository: confidence gate 0.7. How it works: Operator to Task graph; Task graph to Node logs; Task graph to Confidence; Node logs to Live feed; Confidence to Oversight; Oversight to Completed. Built with Next.js, Fastify, SQLite, WebSockets. 664 KB of code, 44 commits. Live demo online in 543 ms.</desc>
